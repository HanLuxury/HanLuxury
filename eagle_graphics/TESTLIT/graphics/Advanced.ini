# EAGLE Graphics - Advanced.ini (pengaturan ahli; dibaca SETELAH Config.ini dan menimpanya)
# Format sama dengan Config.ini. Hapus baris = pakai nilai preset kualitas.
# Ubah pelan-pelan; nilai salah di-clamp ke rentang aman dan dicatat di logOutput.log.

[[Shadow]
[Shadow]
# 0 = split cascade seragam, 1 = logaritmik
    fSplitLambda = 0.75
# bias kedalaman receiver dalam METER (anti shadow acne)
    fDepthBias = 0.06
# offset receiver searah normal, dalam TEXEL shadow map
    fNormalBias = 1.5
# glPolygonOffset saat render caster (slope bias)
    fSlopeBias = 1.6
    fSlopeUnits = 4.0
# jarak tap PCF dalam texel (lihat juga Shadow/Softness di shaderUniform.ini)
    fPcfSpread = 1.0
# band blend antar cascade (restart game untuk bCascadeBlend)
    bCascadeBlend = 1
    fBlendBand = 0.12
# bagian akhir fDistance yang dipakai untuk fade-out halus
    fFadeRange = 0.15
# perluasan light box ke arah matahari (gedung tinggi di luar layar tetap memberi bayangan)
    fCasterExtend = 140.0
# elevasi minimum matahari untuk proyeksi bayangan (derajat)
    fMinElevation = 9.0
# alpha cutoff caster ber-alpha (daun pohon, pagar)
    fAlphaCutoff = 0.45
    iMaxCasters = 1000
# depth 24-bit (lebih presisi, lebih berat)
    bDepth24 = 0
# GL_EXT_shadow_samplers (PCF bilinear hardware) bila GPU mendukung (restart game)
    bHardwarePcf = 1
# scan sektor dunia di sekitar kamera untuk caster di luar layar
    bOffscreenCasters = 1
    fOffscreenDynamicRange = 60.0
    bOffscreenPeds = 0
# porsi "cahaya matahari" pada warna prelit gedung (0..1)
    fPrelitDirectShare = 0.85
# tambahan cahaya matahari pada permukaan yang terkena (0 = mati)
    fSunBoost = 0.10
# warna bayangan manual (r,g,b). Biarkan dikomentari = otomatis per waktu (eagle_timecyc.dat)
;   cTint = 0.46,0.50,0.60
[Shadow]]

[[Sun]
[Sun]
# derajat perubahan arah matahari sebelum kamera cahaya diputar (anti shimmer)
    fUpdateThreshold = 0.10
    bFreeze = 0
# >= 0 : paksa jam tertentu untuk arah matahari (debug), -1 = jam game
    fFreezeHour = -1
[Sun]]

[[Debug]
[Debug]
# baris log tingkat debug di logOutput.log
    bLog = 0
# warnai penerima per cascade: merah / hijau / biru / kuning
    bShowCascade = 0
# tampilkan shadow atlas di kiri bawah layar
    bShowShadowMap = 0
# log arah matahari tiap detik
    bShowSunDirection = 0
    bFreezeSun = 0
    bFreezeShadowCamera = 0
# log waktu CPU shadow pass + jumlah caster tiap 5 detik
    bPerfCounters = 0
# [BELUM AKTIF - PHASE 6]
    bShowDepth = 0
    bShowSSAO = 0
[Debug]]

# EOF
