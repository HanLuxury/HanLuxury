##############################################
# EAGLE Graphics - Config.ini
# /storage/emulated/0/TESTLIT/graphics/Config.ini
# GTA SA Android 2.10 arm64 - dibaca oleh libmultiplayer.so (tanpa AML/CLEO)
;
# FORMAT (sama seperti SA_DOX):
#   ([[GROUP])              pembuka grup (hanya untuk kerapian)
#       ([SECTION])
#           (TIPE)(Key) = (Nilai)
#   ([GROUP]])              penutup grup
;
# TIPE DATA:
#   b  = bool   0 = mati, selain 0 = hidup      ex. bEnabled = 1
#   i  = int                                    ex. iQuality = 2
#   f  = float                                  ex. fDistance = 160.0
#   c  = warna  r,g,b (0..1 atau 0..255)        ex. cTint = 0.46,0.50,0.60
;
# Urutan baca: bawaan -> preset iQuality -> Config.ini -> Advanced.ini.
# Key yang dihapus = pakai nilai preset. Pengaturan ahli ada di Advanced.ini.
# Muat ulang tanpa restart: tab "Grafis" -> "Muat ulang graphics.ini"
# (GraphicsNative.nativeReloadConfig). Pilihan pemain di tab Grafis
# (aktif/kualitas/jarak) disimpan terpisah dan menimpa file ini.
##############################################

[[Graphics]
[Graphics]
    bEnabled = 1
# 0 = LOW, 1 = MEDIUM, 2 = HIGH, 3 = ULTRA (mengatur ulang nilai [Shadow] di bawah)
    iQuality = 2
[Graphics]]

[[Shadow]
[Shadow]
# Bayangan matahari real-time (cascaded shadow map)
    bEnabled = 1
# 1..4 cascade (atlas 1x1 / 2x1 / 2x2)
    iCascades = 3
# resolusi per cascade (dibulatkan ke kelipatan 64)
    iResolution = 2048
# jarak bayangan dari kamera (meter)
    fDistance = 160.0
# kegelapan bayangan 0..1 (dikali profil waktu & cuaca, lihat data/eagle_timecyc.dat)
    fStrength = 0.78
# 0 = 1 tap, 1 = 4 tap, 2 = 9 tap (3x3) - berlaku setelah restart game
    iPcf = 2

# Siapa yang memberi bayangan
    bBuildings = 1
    bObjects = 1
    bVehicles = 1
    bPeds = 1
# senjata di tangan ped
    bWeapons = 1
    bDummies = 1

# permukaan air ikut menerima bayangan (restart game)
    bWater = 0
# sembunyikan bayangan blob/realtime bawaan GTA selama bayangan matahari aktif
    bSuppressGtaShadows = 1
[Shadow]]

[[Performance]
[Performance]
# turunkan jarak bayangan otomatis bila FPS rata-rata < fTargetFps
    bAdaptive = 1
    fTargetFps = 30
[Performance]]

[[PostProcess]
# [BELUM AKTIF - PHASE 6] Disimpan sekarang, dipakai saat post-process selesai.
[Graphics]
    fExposure = 1.05
    fGamma = 2.20
    fSaturation = 1.05
    fContrast = 1.02
[Bloom]
    bEnabled = 1
    fIntensity = 0.65
    fThreshold = 1.0
    fRadius = 1.0
[SSAO]
    bEnabled = 1
    fStrength = 0.55
    fRadius = 0.7
[Fog]
    bEnabled = 1
    fDensity = 1.0
[GodRay]
    bEnabled = 1
    fIntensity = 0.35
[Rain]
    bWetRoad = 1
    fWetness = 1.0
[PostProcess]]

# EOF
