; =====================================================================
;  EAGLE Graphics Engine - /storage/emulated/0/TESTLIT/graphics/graphics.ini
;  GTA SA Android 2.10 arm64 (libmultiplayer.so, tanpa AML)
;
;  Urutan baca: default bawaan -> preset [graphics] quality -> setiap key
;  di file ini menimpa preset. Key yang dihapus = pakai nilai preset.
;  Reload tanpa restart: GraphicsNative.nativeReloadConfig() (JNI).
;  Catatan: kode receiver yang disuntik ke shader GTA dibuat saat game
;  mengompilasi shader (sekali, saat start). pcf / cascadeBlend / water /
;  hardwarePcf / world_shadow.glsl baru berlaku setelah restart game.
; =====================================================================

[graphics]
enabled=1
; 0 = LOW, 1 = MEDIUM, 2 = HIGH, 3 = ULTRA
quality=2
; dipakai mulai PHASE 6 (post-process)
exposure=1.05
gamma=2.20
saturation=1.05
contrast=1.02

[shadow]
enabled=1
; 1..4 cascade (atlas 1x1 / 2x1 / 2x2)
cascades=3
; resolusi per cascade (dibulatkan ke kelipatan 64)
resolution=2048
; jarak bayangan dari kamera (meter)
distance=160.0
; kegelapan bayangan 0..1 (dikali profil waktu & cuaca)
strength=0.78
; 0 = split seragam, 1 = logaritmik
splitLambda=0.75
; bias kedalaman receiver dalam METER (anti shadow acne)
depthBias=0.06
; offset receiver searah normal, dalam TEXEL shadow map
normalBias=1.5
; glPolygonOffset saat render caster (slope bias)
slopeBias=1.6
slopeUnits=4.0
; 0 = 1 tap, 1 = 4 tap, 2 = 9 tap (3x3)
pcf=2
pcfSpread=1.0
cascadeBlend=1
blendBand=0.12
; bagian akhir distance yang dipakai untuk fade-out halus
fadeRange=0.15
; perluasan light box ke arah matahari (gedung tinggi di luar layar tetap memberi bayangan)
casterExtend=140.0
; elevasi minimum matahari untuk proyeksi bayangan (derajat)
minElevation=9.0
; alpha cutoff caster ber-alpha (daun pohon, pagar)
alphaCutoff=0.45
maxCasters=1000
depth24=0
; GL_EXT_shadow_samplers (PCF bilinear hardware) jika GPU mendukung
hardwarePcf=1
buildings=1
objects=1
vehicles=1
peds=1
; senjata di tangan ped ikut memberi bayangan
weapons=1
dummies=1
; scan sektor dunia di sekitar kamera untuk caster di luar layar
offscreenCasters=1
offscreenDynamicRange=60.0
offscreenPeds=0
; permukaan air menerima bayangan
water=0
; sembunyikan blob/realtime shadow bawaan GTA selama bayangan matahari aktif
suppressGtaShadows=1
; porsi "cahaya matahari" pada warna prelit gedung (0..1)
prelitDirectShare=0.85
; tambahan cahaya matahari pada permukaan yang terkena (0 = mati)
sunBoost=0.10
; warna bayangan manual (r,g,b 0..1 atau 0..255). Hapus = otomatis per waktu.
;tint=0.46,0.50,0.60

[sun]
; derajat perubahan arah matahari sebelum kamera cahaya diputar (anti shimmer)
updateThreshold=0.10
freeze=0
; >= 0 : paksa jam tertentu untuk arah matahari (debug), -1 = jam game
freezeHour=-1

[bloom]
enabled=1
intensity=0.65
threshold=1.0
radius=1.0

[ssao]
enabled=1
strength=0.55
radius=0.7

[fog]
enabled=1
density=1.0

[godray]
enabled=1
intensity=0.35

[rain]
wetRoad=1
wetness=1.0

[performance]
; turunkan distance bayangan otomatis bila FPS rata-rata < targetFps (hysteresis)
adaptive=1
targetFps=30

[debug]
log=0
; warna receiver per cascade: merah / hijau / biru / kuning
showCascade=0
; tampilkan shadow atlas di kiri bawah layar
showShadowMap=0
showDepth=0
showSSAO=0
; log arah matahari tiap detik
showSunDirection=0
freezeSun=0
freezeShadowCamera=0
; log waktu CPU shadow pass + jumlah caster tiap 5 detik
perfCounters=0
