//  EAGLE Graphics - shaderUniform.ini
//  Nilai shader yang bisa diubah LANGSUNG (tab "Grafis" di pengaturan,
//  tanpa restart). Dipakai shader lewat deklarasi @ di glShader/*.shader:
//    @float Shadow_Strength < class = "Shadow", name = "Strength", default = 1.0; >
//  Format per baris:  tipe  nama  nilai  min  max  step
//  tipe: bool | int | float.  'endl' = akhir file.
//  Ditulis ulang oleh engine saat tombol simpan ditekan.
// =====================================================================

class	Shadow:
	float	Strength	1	0	1.5	0.05
	float	Softness	1	0.25	3	0.05

class	Building:
	float	ShadowStrength	1	0	1.5	0.05
	float	SunBoost	1	0	3	0.05

class	Vehicle:
	float	ShadowStrength	0.9	0	1.5	0.05
	float	SunBoost	1	0	3	0.05
	float	SpecularInShadow	0.1	0	1	0.05

class	Character:
	float	ShadowStrength	0.85	0	1.5	0.05
	float	SunBoost	1	0	3	0.05
	float	MinLight	0.15	0	1	0.05

endl
